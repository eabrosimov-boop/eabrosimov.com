<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evgeny Abrosimov — South America Tours</title>
  <meta name="description" content="Туры по Южной Америке с личным гидом. Аргентина, Чили, Перу, Боливия, Патагония.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

<body>

  <!-- ===== HEADER ===== -->
  <header>
    <nav>
      <a href="#hero" class="nav-brand">Evgeny Abrosimov</a>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
    </nav>
  </header>

  <!-- ===== TICKER ===== -->
  <div class="ticker-wrap">
    <a href="#" id="ticker-track-link" class="ticker-track-link" target="_blank" rel="noopener">
      <div class="ticker-track" id="ticker-track"></div>
    </a>
    <a href="#" class="ticker-btn" id="ticker-btn" target="_blank" rel="noopener"></a>
  </div>

  <!-- ===== HERO ===== -->
  <section id="hero">
    <div class="hero-slideshow">
      <!-- Замените пути на свои фото. Рекомендуемый формат: горизонтальные JPG, мин. 1920×1080px -->
      <div class="slide" style="background-image: url('images/hero/hero-1.jpg')"></div>
      <div class="slide" style="background-image: url('images/hero/hero-2.jpg')"></div>
      <div class="slide" style="background-image: url('images/hero/hero-3.jpg')"></div>
      <div class="slide" style="background-image: url('images/hero/hero-4.jpg')"></div>
      <div class="slide" style="background-image: url('images/hero/hero-5.jpg')"></div>
      <div class="hero-overlay"></div>
    </div>
    <div class="hero-inner">
      <h1 class="hero-title"></h1>
      <p class="hero-subtitle"></p>
      <a href="#contact" class="btn-primary hero-cta"></a>
    </div>
    <div class="slide-dots" id="slide-dots"></div>
  </section>

  <!-- ===== ABOUT ===== -->
  <section id="about">
    <div class="container">
      <div class="about-grid">
        <div class="about-photo-wrap">
          <img src="images/about/evgeny-portrait.jpg" alt="Evgeny Abrosimov" loading="lazy">
        </div>
        <div class="about-text">
          <span class="section-label about-label"></span>
          <h2 class="about-title"></h2>
          <p class="about-p1"></p>
          <p class="about-p2"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== PRODUCTS ===== -->
  <section id="products">
    <div class="container">
      <div class="tabs-wrap">
        <div class="tabs">
          <button class="tab-btn active" data-tab="excursions">
            <span class="tab-label"></span>
            <span class="tab-sub"></span>
          </button>
          <button class="tab-btn" data-tab="short">
            <span class="tab-label"></span>
            <span class="tab-sub"></span>
          </button>
          <button class="tab-btn" data-tab="long">
            <span class="tab-label"></span>
            <span class="tab-sub"></span>
          </button>
          <button class="tab-btn" data-tab="antarctica">
            <span class="tab-label"></span>
            <span class="tab-sub"></span>
          </button>
          <button class="tab-btn" data-tab="individual">
            <span class="tab-label"></span>
            <span class="tab-sub"></span>
          </button>
        </div>
      </div>

      <div id="tours-container"></div>
    </div>
  </section>

  <!-- ===== REVIEWS ===== -->
  <section id="reviews">
    <div class="container">
      <span class="section-label reviews-label"></span>
      <h2 class="reviews-title"></h2>
      <div class="reviews-grid"></div>
    </div>
  </section>

  <!-- ===== CONTACT ===== -->
  <section id="contact">
    <div class="container">
      <span class="section-label contact-label"></span>
      <h2 class="contact-title"></h2>

    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p class="footer-text"></p>
  </footer>
